<style>
:root {
  /* Global sizing scale: multiplies every absolute length on the page
     (root font size, body font size, gutters, rules). 1 is the unscaled
     design; 0.8 renders at 100% browser zoom exactly as 1 did at 80%. */
  --ui-scale: 0.8;


  /* Lecture note page gutters (customize here). */
  --lecture-page-padding-block: 2rem;
  --lecture-page-padding-inline: 1.5rem;
  /* Floor for left/right inset on narrow viewports; never closer than this. */
  --lecture-page-padding-inline-min: 1.25rem;

  /* Minimum rendered width for figures on narrow viewports (customize here).
     Scaled by --ui-scale through the zoom on img.note-figure. */
  --note-figure-min-width: 240px;

  /* Audio player background (customize here). */
  --note-audio-bg: #fff;
  --note-audio-mobile-break: 41.6em; /* 52em * 0.8 */
  --note-audio-mobile-width: 22em;

  /* Lecture footer navigation (customize here). */
  --lecture-nav-margin-top: 3em;
  --lecture-nav-padding: 1.15em 1em;
  --lecture-nav-bg: #ede8e0;
  --lecture-nav-border-color: #d5cec4;
  --lecture-nav-gap: 0.35em;
  --lecture-nav-num-size: 2.15em;
  --lecture-nav-num-font-size: 0.88em;
  --lecture-nav-btn-font-size: 0.95em;
  --lecture-nav-btn-padding: 0.45em 0.75em;
  --lecture-nav-btn-min-height: 3.25em;
  --lecture-nav-btn-width: 100%;
  --lecture-nav-accent: #24536b;
  --lecture-nav-current-bg: var(--lecture-nav-accent);
  --lecture-nav-current-color: #fff;
  --lecture-nav-num-bg: #fff;
  --lecture-nav-num-border-color: #b8aea2;
  --lecture-nav-num-hover-bg: #faf8f5;
  --lecture-nav-btn-bg: #fff;
  --lecture-nav-btn-border-color: #b8aea2;
  --lecture-nav-preview-font-size: 0.95em;
  --lecture-nav-disabled-opacity: 0.35;
  --lecture-nav-mobile-break: 28.8em; /* 36em * 0.8 */

  /* Top lecture navbar (customize here). */
  --lecture-navbar-bg: var(--lecture-nav-bg);
  --lecture-navbar-border-color: #d5cec4;
  --lecture-navbar-progress-color: var(--lecture-nav-accent);
  --lecture-navbar-track-bg: #9a9084;
  --lecture-navbar-toggle-bg: rgba(250, 248, 245, 0.92);
  --lecture-navbar-toggle-border-color: #c8bfb3;
  --lecture-navbar-toggle-size: 2.75em;
  --lecture-navbar-marker-size: 0.55em;


  /* Course card tints, keyed to the semester a course was taken (customize here).
     Each season redefines the generic --course-card-* variables below. Keep the three
     hues far apart — fall is orange (~28deg), summer yellow (~57deg), spring pink
     (~340deg) — and the tints saturated enough to read as distinct at this lightness;
     paler, closer hues collapse into the same off-white on a bright screen. */
  --card-fall-bg: #fdead7;
  --card-fall-border: #e5ab68;
  --card-fall-hover-bg: #fbdfc2;
  --card-fall-border-strong: #b4762b;
  --card-spring-bg: #fdeaf1;
  --card-spring-border: #e79bb5;
  --card-spring-hover-bg: #fbdce8;
  --card-spring-border-strong: #c25f85;
  --card-summer-bg: #f9f6cb;
  --card-summer-border: #cdc046;
  --card-summer-hover-bg: #f5f1b3;
  --card-summer-border-strong: #9a8a15;

  /* Home page course cards (customize here). */
  --course-card-bg: #fff;
  --course-card-hover-bg: #f2f5f7;
  --course-card-border-color: #b0a496;
  --course-card-hover-border-color: var(--lecture-nav-accent);
  /* Card drop shadow, currently off. Disable it with this no-op shadow rather than
     the keyword `none`: the hover rule composes this variable into a shadow list,
     and `none` is illegal inside a list, which silently voids the whole declaration
     and takes the hover ring with it. For the solid, unblurred version, use:
     calc(4px * var(--ui-scale)) calc(4px * var(--ui-scale)) 0 #e2d7c5 */
  --course-card-shadow: 0 0 0 0 transparent;
  --course-card-border-width: calc(1.5px * var(--ui-scale));
  --course-card-hover-border-width: calc(2.5px * var(--ui-scale));
  --course-card-summary-color: #463f37;
  --course-card-gap: 1.15em;
  --course-card-padding: 1.1em 1.25em 1.3em;
  --course-card-min-height: 12em;
  --course-card-number-size: 1.75em;
  --course-card-title-size: 1.15em;
  --course-card-term-size: 1em;
  /* Optical nudge to line the term's cap height up with the course number's.
     Currently disabled: the term sits flush with the top of the card head. */
  --course-card-term-offset: 0;
  --course-card-summary-size: 0.9em;
  --course-card-mobile-break: 41.6em; /* 52em * 0.8 */

  /* Home page header (customize here). */
  --site-mark-size: 4em;
  --site-title-size: 2.1em;
  --site-title-color: var(--lecture-nav-accent);
  /* Ornaments flanking the title; the gold is the site mark's own. */
  --site-title-flourish-color: #d3a862;
  --site-title-flourish-length: 2em;
  --site-title-flourish-thickness: calc(1.5px * var(--ui-scale));
  --site-title-flourish-diamond: 0.38em;
  --site-title-flourish-gap: 0.4em;
  --site-title-flourish-inset: 0.7em;
}
@font-face {
  font-family: "TeX Gyre Termes";
  src: url("/fonts/texgyretermes-regular.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "TeX Gyre Termes";
  src: url("/fonts/texgyretermes-italic.otf") format("opentype");
  font-weight: 400;
  font-style: italic;
}
@font-face {
  font-family: "TeX Gyre Termes";
  src: url("/fonts/texgyretermes-bold.otf") format("opentype");
  font-weight: 700;
  font-style: normal;
}
html {
  /* Scales every rem-based length; percentage keeps the reader's own default. */
  font-size: calc(100% * var(--ui-scale));
}
body {
  background: var(--page-bg);
  font-family: "TeX Gyre Termes", "Times New Roman", serif;
  font-size: calc(14pt * var(--ui-scale));
  line-height: 1.2;
  margin: 0;
  padding: 2rem 1.5rem;
}
body.lecture-page {
  line-height: 1.5;
  padding-top: calc(var(--lecture-page-padding-block) + var(--lecture-navbar-height, 0px));
  padding-bottom: var(--lecture-page-padding-block);
  padding-inline: max(var(--lecture-page-padding-inline-min), var(--lecture-page-padding-inline));
  scroll-behavior: smooth;
}
@media (max-width: 28.8em) { /* match --lecture-nav-mobile-break above */
  body.lecture-page {
    /* Scale gutters with viewport width on phones; raise min to taste. */
    --lecture-page-padding-inline-min: max(1.25rem, 5vw);
  }
}
.katex {
  font-size: 1em;
}
.katex-display {
  max-width: 100%;
}
.keep-punct {
  white-space: nowrap;
}
main {
  max-width: 52em;
  margin: 0 auto;
  text-align: left;
}
nav.site-nav {
  margin-bottom: 1.5em;
  text-align: center;
}
nav.site-nav a {
  color: inherit;
  text-decoration: none;
}
nav.site-nav a:hover {
  text-decoration: underline;
  text-decoration-color: rgba(0, 0, 0, 0.35);
  text-underline-offset: 0.15em;
}
a:link,
a:visited {
  color: #24536b;
  text-decoration: underline;
  text-decoration-color: rgba(36, 83, 107, 0.35);
  text-underline-offset: 0.18em;
  text-decoration-thickness: 1px;
}
a:hover {
  text-decoration-color: currentColor;
}
.center {
  text-align: center;
}
img.note-figure {
  /* Scales the image's intrinsic pixel size along with the rest of the page. */
  zoom: var(--ui-scale);
  display: block;
  height: auto;
  margin: 0.75em auto;
  max-width: min(100%, 40em);
}
@media (max-width: 41.6em) {
  img.note-figure {
    min-width: min(var(--note-figure-min-width), 100%);
  }
}
img.note-figure.framed {
  box-shadow: 0 0 0 1px #000;
}
.note-audio-wrap {
  display: block;
  margin: 0.75em auto;
  width: 100%;
}
audio.note-audio {
  /* Scales the browser's built-in control chrome along with the rest of the page. */
  zoom: var(--ui-scale);
  display: block;
  width: 100%;
  box-shadow: 0 0 0 1px #000;
  background-color: var(--note-audio-bg);
}
audio.note-audio::-webkit-media-controls-panel {
  background-color: var(--note-audio-bg);
}
audio.note-audio::-webkit-media-controls-enclosure {
  background-color: var(--note-audio-bg);
}
@media (max-width: 41.6em) { /* match --note-audio-mobile-break above */
  .note-audio-wrap {
    width: min(100%, var(--note-audio-mobile-width)) !important;
    max-width: min(100%, var(--note-audio-mobile-width)) !important;
  }
  audio.note-audio {
    box-shadow: none;
    background-color: transparent;
  }
  audio.note-audio::-webkit-media-controls-panel,
  audio.note-audio::-webkit-media-controls-enclosure {
    background-color: transparent;
  }
}
.small-caps,
.katex .small-caps {
  font-variant: small-caps;
}
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
}
pre.verbatim {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  line-height: 1.45;
  margin: 1em 0;
  padding: 0.85em 1em;
  overflow-x: auto;
  background: #fff;
  border: 1px solid #e1e4e8;
  border-radius: calc(6px * var(--ui-scale));
  white-space: pre-wrap;
  word-break: break-word;
}
pre.verbatim code {
  font-size: inherit;
  background: none;
  padding: 0;
}
code.verbatim-inline {
  padding: 0.1em 0.35em;
  background: #f6f8fa;
  border: 1px solid #e1e4e8;
  border-radius: calc(4px * var(--ui-scale));
  white-space: pre-wrap;
  word-break: break-word;
}
.note-html-embed {
  margin: 1.5em auto;
  text-align: left;
}
.note-widget-box {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  max-width: 34em;
  margin: 0 auto;
  padding: 0.85em 2em 1.65em;
  background: #faf8f5;
  box-shadow: 0 0 0 1px #000;
}
.note-html-embed canvas {
  display: block;
  width: 100%;
  height: auto;
}
.speech-viz-toolbar-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.55em;
  margin-top: 0.1em;
  width: 100%;
}
.speech-viz-presets {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.45em;
}
.speech-viz-preset {
  font-family: inherit;
  font-size: 1em;
  line-height: 1;
  min-width: 2.5em;
  padding: 0.55em 0.75em;
  border: 1px solid #bbb;
  background: #fff;
  color: #1a1a1a;
  cursor: pointer;
  white-space: nowrap;
}
.speech-viz-preset:hover {
  background: #faf8f5;
}
.speech-viz-preset[aria-pressed="true"] {
  background: #1a1a1a;
  border-color: #1a1a1a;
  color: #fff;
}
.speech-viz-toolbar-row .note-widget-icon-btn {
  width: 2.65em;
  height: 2.65em;
}
.speech-viz-toolbar-row .note-widget-icon-btn svg {
  width: 1.2em;
  height: 1.2em;
}
.note-widget-controls {
  display: flex;
  flex-direction: column;
  gap: 0.7em;
  margin-top: 0.85em;
}
.note-widget-row {
  display: flex;
  align-items: center;
  gap: 0.75em;
  white-space: nowrap;
}
.note-widget-row label {
  flex: 0 0 2.75em;
  font-weight: 600;
  font-size: 0.92em;
}
.note-widget-row input[type="range"] {
  flex: 1;
  min-width: 0;
  height: calc(4px * var(--ui-scale));
  margin: 0;
  accent-color: #1a1a1a;
  cursor: pointer;
}
.note-widget-row output {
  flex: 0 0 4.25em;
  font-size: 0.92em;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.note-widget-icon-btn {
  /* See .lecture-navbar-toggle: pin the button font so its em box scales. */
  font-size: 0.8333rem;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.35em;
  height: 2.35em;
  padding: 0;
  border: 1px solid #333;
  background: #fff;
  color: #1a1a1a;
  cursor: pointer;
}
.note-widget-icon-btn:hover {
  background: #faf8f5;
}
.note-widget-icon-btn[aria-pressed="true"] {
  background: #1a1a1a;
  color: #fff;
}
.note-widget-icon-btn svg {
  width: 1.05em;
  height: 1.05em;
  fill: currentColor;
}
.note-widget-icon-btn .speech-viz-icon-pause {
  display: none;
}
.note-widget-icon-btn[aria-pressed="true"] .speech-viz-icon-play {
  display: none;
}
.note-widget-icon-btn[aria-pressed="true"] .speech-viz-icon-pause {
  display: block;
}
.note-widget-btn {
  font-family: inherit;
  font-size: 0.95em;
  padding: 0.45em 0.85em;
  border: 1px solid #b8aea2;
  background: #fff;
  color: inherit;
  cursor: pointer;
}
.note-widget-btn:hover {
  background: #faf8f5;
}
.note-widget-btn:active {
  background: #ede8e0;
}
.note-widget-btn:disabled {
  opacity: 0.5;
  cursor: default;
}
section.env {
  margin: 1em 0;
}
section.env .katex {
  color: inherit;
}
section.env > p:first-child {
  margin-top: 0;
}
blockquote.quote {
  border-left: calc(3px * var(--ui-scale)) solid #ccc;
  margin: 1em 0;
  padding-left: 1em;
}
ul {
  margin: 0.5em 0;
  padding-left: 1.5em;
}
ol {
  margin: 0.5em 0;
  padding-left: 1.5em;
}
li > p {
  margin: 0.25em 0;
}
ul.itemize-labeled,
ol.enumerate-labeled {
  list-style: none;
  padding-left: 0;
  margin: 0.5em 0;
}
ul.itemize-labeled > li.item-labeled,
ol.enumerate-labeled > li.item-labeled {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 0.5em;
  align-items: baseline;
  margin: 0;
}
ul.itemize-labeled > li.item-labeled > .item-label,
ol.enumerate-labeled > li.item-labeled > .item-label {
  grid-column: 1;
  white-space: nowrap;
}
ul.itemize-labeled > li.item-labeled > .item-body,
ol.enumerate-labeled > li.item-labeled > .item-body {
  grid-column: 2;
  min-width: 0;
}
ul.itemize-labeled > li.item-labeled > .item-body > p:first-child,
ol.enumerate-labeled > li.item-labeled > .item-body > p:first-child {
  margin-top: 0;
}
ul.itemize-labeled > li.item-labeled > .item-body > p:last-child,
ol.enumerate-labeled > li.item-labeled > .item-body > p:last-child {
  margin-bottom: 0;
}
ul.itemize-labeled > li.item-labeled + li.item-labeled,
ol.enumerate-labeled > li.item-labeled + li.item-labeled {
  margin-top: 0.25em;
}
.boxed-text {
  border: 1px solid #333;
  margin: 0.9em auto;
  padding: 0.55em 0.5em;
  text-align: center;
}
.boxed-text p {
  margin: 0.15em 0;
}
.boxed-text p:first-child {
  margin-top: 0;
}
.boxed-text p:last-child {
  margin-bottom: 0;
}
.vskip {
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
}
.vskip-pull {
  height: 0;
}
.circled {
  border: 1px solid currentColor;
  border-radius: 50%;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35em;
  height: 1.35em;
  padding: 0;
  line-height: 1;
  vertical-align: -0.125em;
}
hr {
  border: none;
  border-top: 1px solid #333;
  margin: 1.5em 0;
  width: min(100%, 24em);
}
header.lecture-header {
  margin-bottom: 2.5em;
  text-align: center;
}
header.lecture-header h1 {
  font-size: 2em;
  font-weight: 700;
  margin: 0 0 0.25em;
}
header.lecture-header .lecture-title {
  font-style: italic;
  font-size: 1.25em;
  margin: 0;
}
h2.heading-section {
  font-size: 1.5em;
  font-weight: 700;
  margin: 2.25em 0 0.75em;
}
main > h2.heading-section:first-of-type {
  margin-top: 1.5em;
}
h3.heading-subsection {
  font-size: 1.3em;
  font-weight: 700;
  margin: 1.75em 0 0.6em;
  scroll-margin-top: calc(var(--lecture-navbar-height, 1.5em) + 0.75em);
}
.subsection-marker {
  font-weight: 700;
}
h4.heading-subsubsection {
  font-size: 1em;
  font-weight: 700;
  margin: 1.25em 0 0.5em;
}
h1 {
  font-size: 1.1em;
  font-weight: 700;
  margin: 0 0 1em;
  text-align: center;
}
header.site-header {
  margin: 0 0 2em;
  text-align: center;
}
img.site-mark {
  display: block;
  height: auto;
  margin: 0 auto 0.55em;
  width: var(--site-mark-size);
}
h1.site-title {
  align-items: center;
  color: var(--site-title-color);
  display: flex;
  font-size: var(--site-title-size);
  gap: var(--site-title-flourish-inset);
  justify-content: center;
  margin: 0;
}
/* Flanking ornament: a rule running outward from a small diamond, in the gold
   of the site mark. Each span holds both parts; the trailing one is reversed so
   the diamond always sits nearest the title. */
.site-title-flourish {
  align-items: center;
  display: inline-flex;
  gap: var(--site-title-flourish-gap);
}
.site-title-flourish--end {
  flex-direction: row-reverse;
}
.site-title-flourish::before,
.site-title-flourish::after {
  background: var(--site-title-flourish-color);
  content: "";
}
.site-title-flourish::before {
  height: var(--site-title-flourish-thickness);
  /* Shrinks with the viewport so the title never overflows on a phone. */
  width: clamp(0.7em, 7vw, var(--site-title-flourish-length));
}
.site-title-flourish::after {
  height: var(--site-title-flourish-diamond);
  transform: rotate(45deg);
  width: var(--site-title-flourish-diamond);
}
.course-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  /* 1fr rows give every card the same height, across rows as well as within one. */
  grid-auto-rows: 1fr;
  gap: var(--course-card-gap);
  margin: 0 0 1.5em;
}
@media (max-width: 41.6em) { /* match --course-card-mobile-break above */
  .course-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
a.course-card:link,
a.course-card:visited {
  color: inherit;
  text-decoration: none;
}
a.course-card {
  background: var(--course-card-bg);
  border: var(--course-card-border-width) solid var(--course-card-border-color);
  box-shadow: var(--course-card-shadow);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-height: var(--course-card-min-height);
  padding: var(--course-card-padding);
  transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
a.course-card:hover {
  background: var(--course-card-hover-bg);
  border-color: var(--course-card-hover-border-color);
  /* Inset ring instead of a thicker border, so hovering never shifts the layout.
     The offset shadow has to be restated here or it drops out on hover. */
  box-shadow:
    inset 0 0 0 var(--course-card-hover-border-width) var(--course-card-hover-border-color),
    var(--course-card-shadow);
}
/* Seasonal tints: each modifier only redefines the generic card variables. */
a.course-card--fall {
  --course-card-bg: var(--card-fall-bg);
  --course-card-border-color: var(--card-fall-border);
  --course-card-hover-bg: var(--card-fall-hover-bg);
  --course-card-hover-border-color: var(--card-fall-border-strong);
}
a.course-card--spring {
  --course-card-bg: var(--card-spring-bg);
  --course-card-border-color: var(--card-spring-border);
  --course-card-hover-bg: var(--card-spring-hover-bg);
  --course-card-hover-border-color: var(--card-spring-border-strong);
}
a.course-card--summer {
  --course-card-bg: var(--card-summer-bg);
  --course-card-border-color: var(--card-summer-border);
  --course-card-hover-bg: var(--card-summer-hover-bg);
  --course-card-hover-border-color: var(--card-summer-border-strong);
}
a.course-card:focus-visible {
