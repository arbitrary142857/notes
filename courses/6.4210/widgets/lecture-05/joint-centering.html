<div class="note-widget-box arm-box jc-box">
<div class="arm-layout">
<canvas class="arm-canvas jc-canvas" role="img" aria-label="Three-link planar arm tracking a target with its tip."></canvas>
<div class="arm-panel">

<p class="arm-legend">
    <span><span class="arm-swatch jc-swatch-target"></span><span>target (drag it)</span></span>
    <span><span class="arm-swatch jc-swatch-pref"></span><span>preferred <i>q</i><sup><i>d</i></sup></span></span>
</p>

<div class="sing-bars">
    <div class="sing-bar">
        <span class="sing-bar-name">Tip error</span>
        <span class="sing-bar-track"><span class="sing-bar-fill sing-bar-e jc-bar-tip"></span></span>
        <output class="sing-bar-out jc-tip-out">0</output>
    </div>
    <div class="sing-bar">
        <span class="sing-bar-name">|<i>q</i><sup><i>d</i></sup> &minus; <i>q</i>|</span>
        <span class="sing-bar-track"><span class="sing-bar-fill jc-bar-post"></span></span>
        <output class="sing-bar-out jc-post-out">0</output>
    </div>
</div>
<span class="arm-live" aria-live="polite"></span>

<div class="note-widget-controls">
    <div class="note-widget-row">
        <label for="jc-k"><span>Stiffness <i>K</i></span></label>
        <input type="range" id="jc-k" min="0" max="3" step="0.1" value="1">
        <output id="jc-k-out">1.0</output>
    </div>
</div>
<p class="sing-formula jc-formula"></p>

<div class="arm-buttons">
    <button type="button" class="note-widget-btn jc-scramble-btn">Scramble posture</button>
    <button type="button" class="note-widget-btn jc-circle-btn" aria-pressed="false">Trace circle</button>
    <button type="button" class="note-widget-btn jc-reset-btn">Reset</button>
</div>
</div>
</div>
</div>

<script>
(function () {
    const root = document.currentScript.closest(".note-html-embed");
    const canvas = root.querySelector(".jc-canvas");
    const ctx = canvas.getContext("2d");

    const kSlider = root.querySelector("#jc-k");
    const kOut = root.querySelector("#jc-k-out");
    const tipFill = root.querySelector(".jc-bar-tip");
    const tipOut = root.querySelector(".jc-tip-out");
    const postFill = root.querySelector(".jc-bar-post");
    const postOut = root.querySelector(".jc-post-out");
    const formulaEl = root.querySelector(".jc-formula");
    const liveEl = root.querySelector(".arm-live");
    const scrambleBtn = root.querySelector(".jc-scramble-btn");
    const circleBtn = root.querySelector(".jc-circle-btn");
    const resetBtn = root.querySelector(".jc-reset-btn");

    const COLOR = {
        joints: ["#3a9e4a", "#2b6cb0", "#7b4fa8"],
        tip: "#c0392b",
        link: "#2f2a24",
        linkFill: "#ffffff",
        grid: "#e6e0d6",
        axis: "#b8aea2",
        pref: "#b26a00",
        target: "#c0392b",
        trail: "rgba(192, 57, 43, 0.35)",
    };
    const L = [1, 1, 1];
    const Q_PREF = [80, -60, -50].map((d) => (d * Math.PI) / 180);
    const DEFAULT_K = 1;
    const VIEW_HALF = 3.3;
    const REACH = 2.85; // targets are clamped inside this radius
    const KP = 4; // task-space gain pulling the tip to the target
    const DX_MAX = 2.5; // cap on |dX|
    const DQ_MAX = 4; // cap on each joint speed (rad/s)
    const DAMP = 1e-4; // tiny damping so J J^T stays invertible
    const SUBSTEPS = 4;
    const POST_MAX = 3; // rad at which the posture bar fills
    const TIP_MAX = 0.5;
    const CIRCLE_R = 0.6;
    const CIRCLE_PERIOD = 6;

    let q = Q_PREF.slice();
    let target = fk(q).tip;
    let dragging = false;
    let circling = false;
    let circlePhase = 0;
    let circleCenter = null;
    let trail = [];
    let frameId = 0;
    let lastFrameTime = 0;

    const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    const numText = (v, digits) => (Math.abs(v) < 0.5 * Math.pow(10, -digits) ? 0 : v).toFixed(digits).replace("-", "−");

    function fk(q) {
        const pts = [[0, 0]];
        let a = 0;
        for (let i = 0; i < 3; i++) {
            a += q[i];
            const p = pts[i];
            pts.push([p[0] + L[i] * Math.cos(a), p[1] + L[i] * Math.sin(a)]);
        }
        // Translational Jacobian (2 x 3): column i is z x (tip - joint i).
        const tip = pts[3];
        const J = [[], []];
        for (let i = 0; i < 3; i++) {
            J[0][i] = -(tip[1] - pts[i][1]);
            J[1][i] = tip[0] - pts[i][0];
        }
        return { pts, tip, J };
    }

    // J^+ = J^T (J J^T + DAMP I)^{-1}, a 3 x 2 matrix.
    function pinv(J) {
        let a = DAMP, b = 0, d = DAMP;
        for (let i = 0; i < 3; i++) {
            a += J[0][i] * J[0][i];
            b += J[0][i] * J[1][i];
            d += J[1][i] * J[1][i];
        }
        const det = a * d - b * b;
        const inv = [[d / det, -b / det], [-b / det, a / det]];
        const P = [];
        for (let i = 0; i < 3; i++) {
            P.push([
                J[0][i] * inv[0][0] + J[1][i] * inv[1][0],
                J[0][i] * inv[0][1] + J[1][i] * inv[1][1],
            ]);
        }
        return P;
    }

    // dq = J^+ dX + (I - J^+ J) K (q^d - q)
    function velocity(q, K) {
        const { tip, J } = fk(q);
        const P = pinv(J);
        let dX = [KP * (target[0] - tip[0]), KP * (target[1] - tip[1])];
        const n = Math.hypot(dX[0], dX[1]);
        if (n > DX_MAX) dX = [dX[0] * DX_MAX / n, dX[1] * DX_MAX / n];

        const v = [0, 1, 2].map((i) => K * wrap(Q_PREF[i] - q[i]));
        const Jv = [0, 1].map((r) => J[r][0] * v[0] + J[r][1] * v[1] + J[r][2] * v[2]);
        const dq = [];
        for (let i = 0; i < 3; i++) {
            const task = P[i][0] * dX[0] + P[i][1] * dX[1];
            const nullPart = v[i] - (P[i][0] * Jv[0] + P[i][1] * Jv[1]);
            dq.push(task + nullPart);
        }
        const m = Math.max(...dq.map(Math.abs));
        return m > DQ_MAX ? dq.map((x) => x * DQ_MAX / m) : dq;
    }

    function postureError() {
        return Math.hypot(...[0, 1, 2].map((i) => wrap(Q_PREF[i] - q[i])));
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || 560;
        const height = width;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { width, height };
    }

    let view = { W: 560, H: 560, S: 1 };
    const px = (p) => [view.W / 2 + p[0] * view.S, view.H * 0.62 - p[1] * view.S];
    const unpx = (x, y) => [(x - view.W / 2) / view.S, (view.H * 0.62 - y) / view.S];

    function drawArm(pts, K, ghost) {
        const P = pts.map(px);
        if (ghost) {
            ctx.strokeStyle = COLOR.pref;
            ctx.lineWidth = 2 * K;
            ctx.setLineDash([6 * K, 5 * K]);
            ctx.beginPath();
            ctx.moveTo(P[0][0], P[0][1]);
            for (let i = 1; i < 4; i++) ctx.lineTo(P[i][0], P[i][1]);
            ctx.stroke();
            ctx.setLineDash([]);
            for (let i = 1; i < 4; i++) {
                ctx.fillStyle = COLOR.pref;
                ctx.beginPath(); ctx.arc(P[i][0], P[i][1], 3 * K, 0, Math.PI * 2); ctx.fill();
            }
            return;
        }
        for (let i = 0; i < 3; i++) {
            ctx.strokeStyle = COLOR.link;
            ctx.lineWidth = 15 * K;
            ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[i + 1][0], P[i + 1][1]); ctx.stroke();
            ctx.strokeStyle = COLOR.linkFill;
            ctx.lineWidth = 11 * K;
            ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[i + 1][0], P[i + 1][1]); ctx.stroke();
        }
        for (let i = 0; i < 4; i++) {
            ctx.fillStyle = i < 3 ? COLOR.joints[i] : COLOR.tip;
            ctx.strokeStyle = COLOR.link;
            ctx.lineWidth = 1.5 * K;
            ctx.beginPath(); ctx.arc(P[i][0], P[i][1], 6 * K, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
    }

    function draw() {
        const K = +kSlider.value;
        const arm = fk(q);
        const tipErr = Math.hypot(arm.tip[0] - target[0], arm.tip[1] - target[1]);
        const post = postureError();

        kOut.textContent = K.toFixed(1);
        tipOut.textContent = numText(tipErr, 2);
        tipFill.style.width = (Math.min(tipErr / TIP_MAX, 1) * 100).toFixed(1) + "%";
        postOut.textContent = numText(post, 2);
        postFill.style.width = (Math.min(post / POST_MAX, 1) * 100).toFixed(1) + "%";
        formulaEl.innerHTML = K > 0
            ? "d<i>q</i> = <i>J</i><sup>+</sup>d<i>X</i> + (<i>I</i> − <i>J</i><sup>+</sup><i>J</i>)&thinsp;"
                + K.toFixed(1) + "(<i>q</i><sup><i>d</i></sup> − <i>q</i>): the posture relaxes toward "
                + "<i>q</i><sup><i>d</i></sup> without moving the tip."
            : "<i>K</i> = 0 is the plain pseudo-inverse: the tip still tracks, "
                + "but nothing pulls the posture back, so it drifts.";

        const { width: W, height: H } = resizeCanvas();
        view = { W, H, S: H / 2 / VIEW_HALF };
        const S = view.S;
        const UI = Math.min(Math.max(W / 560, 0.8), 1.5);

        ctx.clearRect(0, 0, W, H);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        const O = px([0, 0]);
        ctx.strokeStyle = COLOR.grid;
        ctx.lineWidth = 1;
        for (let x = O[0] % S; x <= W; x += S) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = O[1] % S; y <= H; y += S) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
        ctx.strokeStyle = COLOR.axis;
        ctx.beginPath(); ctx.moveTo(0, O[1]); ctx.lineTo(W, O[1]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(O[0], 0); ctx.lineTo(O[0], H); ctx.stroke();

        drawArm(fk(Q_PREF).pts, UI, true);

        if (trail.length > 1) {
            ctx.strokeStyle = COLOR.trail;
            ctx.lineWidth = 2 * UI;
            ctx.beginPath();
            trail.forEach((p, i) => {
                const s = px(p);
                if (i === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]);
            });
            ctx.stroke();
        }

        drawArm(arm.pts, UI, false);

        const T = px(target);
        const r = 10 * UI;
        ctx.strokeStyle = COLOR.target;
        ctx.lineWidth = 2 * UI;
        ctx.beginPath(); ctx.arc(T[0], T[1], r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(T[0] - 1.6 * r, T[1]); ctx.lineTo(T[0] - 0.5 * r, T[1]);
        ctx.moveTo(T[0] + 0.5 * r, T[1]); ctx.lineTo(T[0] + 1.6 * r, T[1]);
        ctx.moveTo(T[0], T[1] - 1.6 * r); ctx.lineTo(T[0], T[1] - 0.5 * r);
        ctx.moveTo(T[0], T[1] + 0.5 * r); ctx.lineTo(T[0], T[1] + 1.6 * r);
        ctx.stroke();

        const deg = q.map((a) => Math.round((wrap(a) * 180) / Math.PI));
        canvas.setAttribute("aria-label",
            "Three-link arm with joint angles " + deg.join(", ") + " degrees. Tip error "
            + numText(tipErr, 2) + "; distance from preferred posture " + numText(post, 2) + " radians.");
    }

    function step(now) {
        const dt = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, 0.05) : 0;
        lastFrameTime = now;
        const K = +kSlider.value;

        if (circling) {
            circlePhase += (2 * Math.PI * dt) / CIRCLE_PERIOD;
            target = [
                circleCenter[0] + CIRCLE_R * Math.cos(circlePhase),
                circleCenter[1] + CIRCLE_R * Math.sin(circlePhase),
            ];
            trail.push(fk(q).tip);
            if (trail.length > 400) trail.shift();
        }
        for (let s = 0; s < SUBSTEPS; s++) {
            const dq = velocity(q, K);
            for (let i = 0; i < 3; i++) q[i] += (dq[i] * dt) / SUBSTEPS;
        }
        draw();
        frameId = requestAnimationFrame(step);
    }

    function clampReach(p) {
        const n = Math.hypot(p[0], p[1]);
        return n > REACH ? [p[0] * REACH / n, p[1] * REACH / n] : p;
    }

    function setCircling(on) {
        circling = on;
        circleBtn.setAttribute("aria-pressed", on ? "true" : "false");
        trail = [];
        if (on) {
            // Keep the whole circle inside the workspace.
            const c = [target[0] - CIRCLE_R, target[1]];
            const n = Math.hypot(c[0], c[1]);
            const maxN = REACH - CIRCLE_R;
            circleCenter = n > maxN ? [c[0] * maxN / n, c[1] * maxN / n] : c;
            circlePhase = 0;
        }
    }

    // Self-motion: walk q along the 1-D null space of J, correcting the tip as we go.
    function scramble() {
        const sign = Math.random() < 0.5 ? -1 : 1;
        const amount = 1.2 + Math.random() * 1.2;
        const N = 200;
        const goal = fk(q).tip;
        for (let s = 0; s < N; s++) {
            const { tip, J } = fk(q);
            const nvec = [
                J[0][1] * J[1][2] - J[0][2] * J[1][1],
                J[0][2] * J[1][0] - J[0][0] * J[1][2],
                J[0][0] * J[1][1] - J[0][1] * J[1][0],
            ];
            const nn = Math.hypot(...nvec) || 1;
            const P = pinv(J);
            const e = [goal[0] - tip[0], goal[1] - tip[1]];
            for (let i = 0; i < 3; i++) {
                q[i] += (sign * amount / N) * nvec[i] / nn + P[i][0] * e[0] + P[i][1] * e[1];
            }
        }
        liveEl.textContent = "Posture scrambled; the tip stayed put.";
    }

    function pointerPos(ev) {
        const rect = canvas.getBoundingClientRect();
        return unpx(ev.clientX - rect.left, ev.clientY - rect.top);
    }
    canvas.addEventListener("pointerdown", (ev) => {
        if (circling) setCircling(false);
        dragging = true;
        canvas.setPointerCapture(ev.pointerId);
        target = clampReach(pointerPos(ev));
        ev.preventDefault();
    });
    canvas.addEventListener("pointermove", (ev) => {
        if (dragging) target = clampReach(pointerPos(ev));
    });
    const endDrag = () => { dragging = false; };
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    canvas.style.touchAction = "none";
    canvas.style.cursor = "crosshair";

    kSlider.addEventListener("input", draw);
    scrambleBtn.addEventListener("click", scramble);
    circleBtn.addEventListener("click", () => setCircling(!circling));
    resetBtn.addEventListener("click", () => {
        setCircling(false);
        q = Q_PREF.slice();
        target = fk(q).tip;
        kSlider.value = String(DEFAULT_K);
        draw();
    });

    window.addEventListener("resize", draw);
    frameId = requestAnimationFrame(step);
})();
</script>
